<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 | 보디빌딩·PT 트레이너</title>
<meta name="description" content="웨이트 7년, 보디빌딩 대회 3년 출전. 서산시·한서대 청년건강프로그램 PT 트레이너 프로필.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#ECEFEA;
  --iron:#2B2F36;
  --steel:#8A939C;
  --plate-blue:#1F4FD8;
  --plate-yellow:#F2C230;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--chalk);color:var(--iron);font-family:var(--body);line-height:1.7;-webkit-text-size-adjust:100%}
body{margin:0}
main{max-width:760px;margin:0 auto;padding:56px 24px 96px}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:clamp(2.6rem,9vw,4.75rem);line-height:1.1;letter-spacing:-0.01em}
h2{font-size:1.5rem;margin-bottom:8px}
.lead{font-size:1.1rem;max-width:34em;margin:24px 0 0}
.bar{margin:48px 0 8px}
.bar svg{display:block;width:100%;height:auto}
.bar text{font-family:var(--body);font-size:15px;font-weight:500;fill:var(--iron)}
.bar figcaption{font-size:.9rem;color:#4A5058;margin-top:4px}
section{margin-top:64px}
.row{display:grid;grid-template-columns:1fr;gap:4px;padding:20px 0;border-top:1px solid rgba(43,47,54,.25)}
.row:last-child{border-bottom:1px solid rgba(43,47,54,.25)}
.row h3{margin:0;font-size:1.05rem;font-weight:700}
.row p{margin:0;color:#3A3F47}
.tag{display:inline-block;margin-left:8px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:500;vertical-align:2px}
.tag.done{background:var(--plate-blue);color:#fff}
.tag.ing{border:1.5px solid var(--plate-blue);color:var(--plate-blue)}
@media (min-width:640px){
  .row{grid-template-columns:200px 1fr;gap:24px}
}
a:focus-visible{outline:3px solid var(--plate-blue);outline-offset:3px}
</style>
</head>
<body>
<main>
  <header>
    <h1>웨이트 7년,<br>무대 위 3년.</h1>
    <p class="lead">보디빌딩을 7년째 하고 있는 대학교 4학년입니다. 지금은 서산시·한서대 청년건강프로그램에서 PT 트레이너로 일하고 있습니다.</p>
  </header>

  <figure class="bar">
    <svg viewBox="0 0 720 230" role="img" aria-label="바벨 원판 두 개. 큰 원판은 웨이트 7년, 작은 원판은 대회 출전 3년을 나타냅니다.">
      <rect x="20" y="108" width="680" height="14" rx="3" fill="#8A939C"/>
      <rect x="150" y="100" width="14" height="30" rx="2" fill="#2B2F36"/>
      <rect x="100" y="25" width="30" height="180" rx="5" fill="#1F4FD8"/>
      <rect x="136" y="76.5" width="22" height="77" rx="4" fill="#F2C230"/>
      <text x="115" y="226" text-anchor="middle">웨이트 7년</text>
      <text x="147" y="60" text-anchor="start" dx="14">대회 출전 3년</text>
    </svg>
    <figcaption>원판 크기는 햇수에 비례합니다.</figcaption>
  </figure>

  <section aria-labelledby="career">
    <h2 id="career">경력</h2>
    <div class="row">
      <h3>웨이트 트레이닝</h3>
      <p>7년째 꾸준히 이어오고 있습니다.</p>
    </div>
    <div class="row">
      <h3>보디빌딩 대회</h3>
      <p>3년간 대회에 출전했습니다.</p>
    </div>
  </section>

  <section aria-labelledby="license">
    <h2 id="license">자격</h2>
    <div class="row">
      <h3>생활스포츠지도사 2급<span class="tag done">취득</span></h3>
      <p>종목은 보디빌딩입니다.</p>
    </div>
    <div class="row">
      <h3>건강운동관리사<span class="tag ing">연수 중</span></h3>
      <p>올해 필기와 실기에 합격했고, 현재 연수 과정을 듣고 있습니다.</p>
    </div>
  </section>

  <section aria-labelledby="now">
    <h2 id="now">현재 활동</h2>
    <div class="row">
      <h3>PT 트레이너</h3>
      <p>서산시·한서대 청년건강프로그램에서 청년 회원의 운동을 지도합니다.</p>
    </div>
  </section>
</main>
</body>
</html>
